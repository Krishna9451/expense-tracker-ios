name: ExpenseTracker
options:
  bundleIdPrefix: com.krishna
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ExpenseTracker:
    type: application
    platform: iOS
    sources:
      - ExpenseTracker
    info:
      path: ExpenseTracker/Info.plist
      properties:
        CFBundleDisplayName: Expense Tracker
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krishna.ExpenseTracker
  ExpenseTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ExpenseTrackerTests
    dependencies:
      - target: ExpenseTracker
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExpenseTracker:
    build:
      targets:
        ExpenseTracker: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExpenseTrackerTests
